<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دفتر کهاته سلطان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; }
        body { background-color: #f4f6f8; padding: 15px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #8B0000; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select, button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 5px; }
        button:hover { background-color: #218838; }
        .summary { display: flex; justify-content: space-between; margin: 20px 0; gap: 10px; }
        .card { flex: 1; padding: 10px; border-radius: 6px; text-align: center; color: white; }
        .card.green { background-color: #28a745; }
        .card.red { background-color: #dc3545; }
        .card.blue { background-color: #007bff; }
        .card span { display: block; font-size: 18px; font-weight: bold; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #8B0000; color: white; }
        .btn-del { background-color: #dc3545; padding: 4px 8px; font-size: 12px; width: auto; }
    </style>
</head>
<body>

<div class="container">
    <h2>دفتر کهاته سلطان</h2>
    
    <div class="form-group">
        <label>نام شخص / حساب:</label>
        <input type="text" id="name" placeholder="مثلاً: احمد">
    </div>
    
    <div class="form-group">
        <label>نوع معامله:</label>
        <select id="type">
            <option value="رسید">رسید (دریافت شد)</option>
            <option value="برد">برد (قرض داده شد)</option>
        </select>
    </div>

    <div class="form-group">
        <label>مبلغ:</label>
        <input type="number" id="amount" placeholder="مبلغ را وارد کنید">
    </div>

    <div class="form-group">
        <label>شرح / توضیحات:</label>
        <input type="text" id="desc" placeholder="توضیحات اختیاری">
    </div>

    <button onclick="addTransaction()">ثبت معامله</button>

    <div class="summary">
        <div class="card green">کل رسید<span id="totalRec">0</span></div>
        <div class="card red">کل برد<span id="totalGiven">0</span></div>
        <div class="card blue">باقی‌مانده<span id="balance">0</span></div>
    </div>

    <h3>لیست تراکنش‌ها</h3>
    <table>
        <thead>
            <tr>
                <th>نام</th>
                <th>نوع</th>
                <th>مبلغ</th>
                <th>شرح</th>
                <th>حذف</th>
            </tr>
        </thead>
        <tbody id="list"></tbody>
    </table>
</div>

<script>
    let transactions = JSON.parse(localStorage.getItem('khatasultan_data')) || [];

    function updateUI() {
        const list = document.getElementById('list');
        list.innerHTML = '';
        
        let totalRec = 0;
        let totalGiven = 0;

        transactions.forEach((item, index) => {
            if(item.type === 'رسید') totalRec += Number(item.amount);
            if(item.type === 'برد') totalGiven += Number(item.amount);

            let row = `<tr>
                <td>${item.name}</td>
                <td>${item.type}</td>
                <td>${item.amount}</td>
                <td>${item.desc || '-'}</td>
                <td><button class="btn-del" onclick="deleteItem(${index})">X</button></td>
            </tr>`;
            list.innerHTML += row;
        });

        document.getElementById('totalRec').innerText = totalRec;
        document.getElementById('totalGiven').innerText = totalGiven;
        document.getElementById('balance').innerText = totalRec - totalGiven;

        localStorage.setItem('khatasultan_data', JSON.stringify(transactions));
    }

    function addTransaction() {
        const name = document.getElementById('name').value;
        const type = document.getElementById('type').value;
        const amount = document.getElementById('amount').value;
        const desc = document.getElementById('desc').value;

        if(!name || !amount) {
            alert('لطفاً نام و مبلغ را وارد کنید');
            return;
        }

        transactions.push({ name, type, amount, desc });
        
        document.getElementById('name').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('desc').value = '';

        updateUI();
    }

    function deleteItem(index) {
        transactions.splice(index, 1);
        updateUI();
    }

    updateUI();
</script>

</body>
</html>
